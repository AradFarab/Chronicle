name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hozur_test
          POSTGRES_USER: hozur
          POSTGRES_PASSWORD: hozur
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U hozur" --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Pango for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Schema matches the models
        env:
          HOZUR_DATABASE_URL: postgresql+psycopg://hozur:hozur@localhost:5432/hozur_test
        run: |
          hozur db upgrade
          alembic check
          alembic downgrade base
      - name: Tests
        env:
          HOZUR_TEST_DATABASE_URL: postgresql+psycopg://hozur:hozur@localhost:5432/hozur_test
        run: pytest -q
      - name: Every message is translated
        working-directory: .
        run: python3 tools/i18n.py --check

  frontend:
    name: PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  audit:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pip-audit && pip-audit --desc on ./backend
