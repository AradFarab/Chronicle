# Production on the company's own server:
#   cp docker/.env.example docker/.env   # then set CHRONICLE_SECRET_KEY and POSTGRES_PASSWORD
#   docker compose -f docker/compose.yml --env-file docker/.env up -d --build
#   docker compose -f docker/compose.yml exec app chronicle create-user admin --role admin
# The app listens on port 8000; put it behind the company's HTTPS reverse proxy for the PWA.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hozur
      POSTGRES_USER: hozur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hozur -d hozur"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ..
    image: chronicle:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      CHRONICLE_DATABASE_URL: postgresql+psycopg://hozur:${POSTGRES_PASSWORD}@db:5432/hozur
      CHRONICLE_SECRET_KEY: ${CHRONICLE_SECRET_KEY:?set CHRONICLE_SECRET_KEY in docker/.env}
      CHRONICLE_TIMEZONE: ${CHRONICLE_TIMEZONE:-Asia/Tehran}
      CHRONICLE_COOKIE_SECURE: ${CHRONICLE_COOKIE_SECURE:-true}
    volumes:
      - files:/data
    ports:
      - "${CHRONICLE_PORT:-8000}:8000"

  worker:
    image: chronicle:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment: *env
    volumes:
      - files:/data
    command: ["chronicle", "worker"]
    # The worker talks to attendance devices on the company network (TCP 4370).

volumes:
  db:
  files:
