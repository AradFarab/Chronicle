exclude: 'node_modules|.git|frontend/dist'
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "^(backend|frontend/src|tools|docker)/"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg|.*po$|.*pot$"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
